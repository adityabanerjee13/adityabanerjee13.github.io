<!-- TEMPORARY: font-size preview slider. Remove this file and its include in _layouts/default.html once a size is chosen. -->
<div id="fs-preview" role="group" aria-label="Font size preview">
  <div class="fs-row">
    <label for="fs-range">Text size</label>
    <output id="fs-out" for="fs-range"></output>
  </div>
  <input id="fs-range" type="range" min="50" max="100" step="5" value="100">
  <div class="fs-ticks" aria-hidden="true"><span>−50%</span><span>−25%</span><span>Default</span></div>
  <button type="button" id="fs-reset">Reset</button>
</div>
<style>
  #fs-preview { position: fixed; right: 16px; top: 76px; z-index: 30; width: 230px; padding: 12px 14px; border: 1px solid var(--global-border-color); border-radius: 10px; background: var(--global-bg-color); color: var(--global-text-color); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
  #fs-preview .fs-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-weight: 600; }
  #fs-preview output { font-weight: 400; font-variant-numeric: tabular-nums; }
  #fs-preview input { width: 100%; margin: 0; }
  #fs-preview .fs-ticks { display: flex; justify-content: space-between; font-size: 11px; opacity: .7; }
  #fs-preview button { margin-top: 8px; padding: 3px 10px; border: 1px solid var(--global-border-color); border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
</style>
<script>
  (function () {
    var range = document.getElementById('fs-range');
    var out = document.getElementById('fs-out');
    var root = document.documentElement;
    function base() { return window.innerWidth >= 768 ? 18 : 16; } // template defaults
    function apply(pct) {
      var px = base() * pct / 100;
      root.style.fontSize = pct === 100 ? '' : px + 'px';
      out.textContent = (pct === 100 ? 'default' : '−' + (100 - pct) + '%') + ' · ' + (Math.round(px * 10) / 10) + 'px';
      try { localStorage.setItem('fs-preview', pct); } catch (e) {}
    }
    var saved = 100;
    try { saved = parseInt(localStorage.getItem('fs-preview'), 10) || 100; } catch (e) {}
    range.value = saved;
    apply(saved);
    range.addEventListener('input', function () { apply(parseInt(range.value, 10)); });
    window.addEventListener('resize', function () { apply(parseInt(range.value, 10)); });
    document.getElementById('fs-reset').addEventListener('click', function () { range.value = 100; apply(100); });
  })();
</script>
